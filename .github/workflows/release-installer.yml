name: Release installer bundle

# Fires on version tags (v*). Lints the prod-example shell scripts, packages
# install.sh + nginx/ templates into installer.tar.gz, publishes it on the
# GitHub Release with a matching SHA256SUMS file.
#
# ClawOps backend (application.properties -> claw.chat.installer.tag +
# claw.chat.installer.sha256) points at a specific release; bootstrap.sh on
# end-user VPSes pulls the tarball from the same URL.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qy && sudo apt-get install -qy shellcheck

      - name: Lint shell scripts
        run: |
          shellcheck prod-example/bootstrap.sh prod-example/install.sh
          bash -n prod-example/bootstrap.sh
          bash -n prod-example/install.sh

      - name: Build installer.tar.gz
        run: |
          mkdir -p dist
          tar -czf dist/installer.tar.gz \
            -C prod-example \
            install.sh \
            nginx/http-only.conf \
            nginx/https.conf
          (cd dist && sha256sum installer.tar.gz > SHA256SUMS)
          echo "── Bundle contents ──"
          tar -tzf dist/installer.tar.gz
          echo "── SHA256 ──"
          cat dist/SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/installer.tar.gz dist/SHA256SUMS \
            --title "${GITHUB_REF_NAME}" \
            --notes "Installer bundle for claw-chat ${GITHUB_REF_NAME}.

          Bootstrap from a bare VPS:

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/prod-example/bootstrap.sh \\
            | sudo -E HOSTNAME=chat.example.com ALLOWED_EMAIL=me@example.com \\
                       INSTALLER_TAG=${GITHUB_REF_NAME} \\
                       INSTALLER_SHA256=\$(cat SHA256SUMS | awk '{print \$1}') bash
          \`\`\`
          "
