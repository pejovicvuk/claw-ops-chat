services:
  claw-chat:
    build: .
    image: teslicvukasin/claw-chat:latest
    container_name: claw-chat
    env_file: .env
    volumes:
      # Claude Code auth (read-only)
      - /root/.claude/.credentials.json:/root/.claude/.credentials.json:ro
      # Claude Code session persistence (read-write)
      - /root/.claude/projects:/root/.claude/projects
      # Host filesystem access for Claude Code tools (mapped to same path for session consistency)
      - /root:/root
      # Bitbucket skill (read-only)
      - ./skills/bitbucket:/opt/skills/bitbucket:ro
      # Monitoring: Docker socket (read-only) — enables the Docker section.
      # The monitoring API gates writes server-side via authenticated
      # ConfirmActionDialog flows; the read-only mount blocks daemon-level
      # mutations even if the container is compromised.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Monitoring: host /proc and /sys for accurate system metrics.
      # systeminformation reads HOST_PROC + HOST_SYS env vars to use these
      # mount points instead of the container's narrow view.
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
    environment:
      # Tell systeminformation to read host /proc + /sys (set above).
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - HOST_ETC=/host/etc
    ports:
      - "${PORT:-3100}:${PORT:-3100}"
    init: true
    restart: unless-stopped
    # Security: drop unnecessary capabilities
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # Security: read-only root filesystem where possible
    read_only: false
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:${PORT:-3100}/chat/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
