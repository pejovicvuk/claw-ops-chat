# WebSocket upgrade helper — required for /chat/ws/chat and /chat/ws/terminal.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Upstream container (service name from docker-compose.yml).
upstream claw_chat {
    server claw-chat:3100;
    keepalive 32;
}

# ── HTTP ──────────────────────────────────────────────────────────────
# Until TLS certs are mounted, serve over plain HTTP.
# After enabling the HTTPS block below, change this block to redirect:
#     return 301 https://$host$request_uri;
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 50m;

    location / {
        proxy_pass http://claw_chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade for /ws/chat and /ws/terminal.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Long-lived streams — bump these so idle WS connections don't drop.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

